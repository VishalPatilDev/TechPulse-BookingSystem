spring:
  application:
    name: booking-system



  datasource:
    url: jdbc:h2:mem:bookingdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


server:
  servlet:
    context-path: /booking-system

jwt:
  secret: mine-very-long-and-secure-secret-key-here-at-least-32-characters
  expiration: 86400000
